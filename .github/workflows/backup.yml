name: Supabase Backup

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pg_dump 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          sudo update-alternatives --install /usr/bin/pg_dump pg_dump /usr/lib/postgresql/17/bin/pg_dump 100

      - name: Backup RICO
        run: |
          mkdir -p backups
          pg_dump "${{ secrets.RICO_DB_URL }}" \
            --no-owner --no-acl | gzip > backups/rico_$(date +%Y-%m-%d).sql.gz

      - name: Backup Alcla v2
        run: |
          pg_dump "${{ secrets.ALCLA_DB_URL }}" \
            --no-owner --no-acl | gzip > backups/alcla_$(date +%Y-%m-%d).sql.gz

      - name: Verificar backups
        run: |
          echo "=== RICO ==="
          gunzip -t backups/rico_$(date +%Y-%m-%d).sql.gz && echo "OK: archivo íntegro"
          LINES=$(gunzip -c backups/rico_$(date +%Y-%m-%d).sql.gz | wc -l)
          echo "Líneas: $LINES"
          if [ "$LINES" -lt 100 ]; then echo "ERROR: archivo sospechosamente chico"; exit 1; fi

          echo "=== ALCLA ==="
          gunzip -t backups/alcla_$(date +%Y-%m-%d).sql.gz && echo "OK: archivo íntegro"
          LINES=$(gunzip -c backups/alcla_$(date +%Y-%m-%d).sql.gz | wc -l)
          echo "Líneas: $LINES"
          if [ "$LINES" -lt 100 ]; then echo "ERROR: archivo sospechosamente chico"; exit 1; fi

      - name: Limpiar backups viejos
        run: |
          find backups/ -name "*.sql.gz" -mtime +30 -delete

      - name: Commit backups
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backups/
          git commit -m "backup $(date +%Y-%m-%d)" || echo "Sin cambios"
          git push
