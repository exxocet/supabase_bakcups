name: Supabase Backup

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        run: |
          curl -sSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz
          sudo mv supabase /usr/local/bin/

      - name: Backup RICO
        run: |
          mkdir -p backups
          PGPASSWORD=19deOctubre2040! pg_dump \
            -h db.uekcfkmpmbrbyltqxhmy.supabase.co \
            -U postgres \
            -d postgres \
            --no-owner --no-acl \
            -f backups/rico_$(date +%Y-%m-%d).sql
        env:
          PGSSLMODE: require

      - name: Backup Alcla v2
        run: |
          PGPASSWORD=19deOctubre2040! pg_dump \
            -h db.tjziutnvbaknqgtshdla.supabase.co \
            -U postgres \
            -d postgres \
            --no-owner --no-acl \
            -f backups/alcla_$(date +%Y-%m-%d).sql
        env:
          PGSSLMODE: require

      - name: Commit backups
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backups/
          git commit -m "backup $(date +%Y-%m-%d)" || echo "Sin cambios"
          git push
